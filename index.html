<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tính điểm cách đều các đỉnh</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container py-4 py-md-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
          <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
              <div class="mb-4 text-center">
                <span class="badge text-bg-primary px-3 py-2 rounded-pill">MeasureLand</span>
                <h1 class="h3 mt-3 mb-0">Tính điểm cách đều tất cả các đỉnh</h1>
              </div>

              <div class="row g-3 align-items-end">
                <div class="col-12">
                  <label for="polygonSides" class="form-label fw-semibold">Chọn số cạnh của đa giác</label>
                  <select id="polygonSides" class="form-select form-select-lg">
                    <option value="3">3 cạnh</option>
                    <option value="4">4 cạnh</option>
                    <option value="5">5 cạnh</option>
                  </select>
                </div>
              </div>

              <div id="sideInputsWrap" class="mt-4"></div>

              <div class="row g-4 align-items-start mt-1">
                <div class="col-12">
                  <div class="border rounded-4 overflow-hidden bg-light-subtle">
                    <canvas id="polygonCanvas" width="720" height="340"></canvas>
                  </div>
                </div>

                <div class="col-12">
                  <div class="card border-0 bg-light-subtle h-100">
                    <div class="card-body p-3">
                      <div class="d-flex justify-content-between align-items-center mb-3">
                        <label class="form-label fw-semibold mb-0">Danh sách cạnh</label>
                      </div>
                      <div id="sideList" class="list-group list-group-flush"></div>
                    </div>
                  </div>
                </div>
              </div>

              <div class="d-flex gap-2 mt-4 flex-wrap">
                <button id="calculateBtn" class="btn btn-primary btn-lg flex-grow-1" type="button">
                  Tính toán
                </button>
                <button id="resetBtn" class="btn btn-outline-secondary btn-lg" type="button">
                  Làm mới
                </button>
              </div>

              <div id="messageBox" class="alert mt-4 mb-0 d-none" role="alert"></div>

              <div id="summaryCard" class="mt-4 d-none">
                <div class="card border-0 bg-light-subtle">
                  <div class="card-body p-3 p-md-4">
                    <div class="d-flex justify-content-between align-items-center gap-2">
                      <h2 class="h5 mb-0">Tổng quan ngắn gọn</h2>
                      <button id="toggleDetailsBtn" type="button" class="btn btn-link p-0 text-decoration-none" aria-expanded="false">
                        <span class="me-1">Mở rộng</span>
                        <span id="toggleDetailsIcon">▼</span>
                      </button>
                    </div>

                    <div id="summaryOverview" class="mt-3"></div>

                    <div id="summaryDetails" class="mt-3 d-none">
                      <div id="summaryDetailContent"></div>
                    </div>
                  </div>
                </div>
              </div>

              <div id="resultCard" class="mt-4 d-none">
                <div class="card border-0 bg-light-subtle">
                  <div class="card-body p-3 p-md-4">
                    <h2 class="h5 mb-3">Kết quả chi tiết</h2>
                    <div id="resultSummary"></div>
                    <div class="table-responsive mt-3">
                      <table class="table table-sm align-middle mb-0">
                        <thead>
                          <tr>
                            <th scope="col">Đỉnh</th>
                            <th scope="col">Khoảng cách (m)</th>
                          </tr>
                        </thead>
                        <tbody id="vertexDistances"></tbody>
                      </table>
                    </div>
                    <div class="table-responsive mt-3">
                      <table class="table table-sm align-middle mb-0">
                        <thead>
                          <tr>
                            <th scope="col">Cạnh</th>
                            <th scope="col">Khoảng cách (m)</th>
                          </tr>
                        </thead>
                        <tbody id="sideDistances"></tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
